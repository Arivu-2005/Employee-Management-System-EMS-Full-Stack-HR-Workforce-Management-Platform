<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login – EMS Pro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet"></head><body>
<div class="login p-3"><div class="card"><div class="text-center mb-4"><h2 class="fw-bold text-primary"><i class="bi bi-buildings"></i> EMS Pro</h2><p class="text-secondary mb-0">Sign in to the Admin Dashboard</p></div>
<form id="loginForm" novalidate><div id="err" class="text-danger small mb-2"></div>
<label class="form-label">Email</label><input id="email" type="email" class="form-control mb-3" placeholder="admin@ems.com">
<label class="form-label">Password</label><div class="input-group mb-3"><input id="password" type="password" class="form-control" placeholder="••••••"><button type="button" id="eye" class="btn btn-outline-secondary"><i class="bi bi-eye"></i></button></div>
<div class="form-check mb-3"><input id="remember" type="checkbox" class="form-check-input"><label class="form-check-label" for="remember">Remember me</label></div>
<button class="btn btn-primary w-100 py-2">Login</button></form>
<div class="alert alert-info mt-3 mb-0 small"><b>Demo:</b> admin@ems.com / admin123<br>Data is stored in LocalStorage (demo only).</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
